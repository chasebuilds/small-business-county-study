[project]
name = "small-business-county-study"
version = "0.1.0"
description = "Reproducible analysis of small-business conditions in Eastern Kentucky counties vs Kentucky and the US, from free public Census data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pandas>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools]
packages = ["sbcs"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"sbcs/report.py" = ["E501"]
"sbcs/charts.py" = ["E501"]
